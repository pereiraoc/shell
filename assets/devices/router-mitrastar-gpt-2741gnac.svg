<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 540" width="2000" height="540">
  <!-- MitraStar GPT-2741GNAC-N2 (gateway Vivo Fibra) de frente. NAO HA FOTO DE FRENTE: elevacao
       construida a partir da foto em tres quartos: dois andares (o de cima com o dobro da altura
       e um pouco mais largo), sem antena externa, 4 LEDs no pe do andar de cima, a esquerda, e
       respiro no de baixo. 0,1 mm, com 20 x 5,4 cm ESTIMADOS (medidas nao publicadas).
       So linhas (Colouriser pinta com a tinta do tema). -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- andar de cima -->
    <rect x="12" y="12" width="1976" height="348" rx="44" ry="44" stroke-width="24" />
    <!-- andar de baixo -->
    <path stroke-width="24" d="M44 360 V496 a32 32 0 0 0 32 32 H1924 a32 32 0 0 0 32 -32 V360" />
    <!-- respiro -->
    <path stroke-width="10" stroke-dasharray="32 28" d="M132 424 H1720" />
    <path stroke-width="10" stroke-dasharray="32 28" stroke-dashoffset="30" d="M132 472 H1720" />
    <!-- LEDs -->
    <circle cx="232" cy="306" r="13" stroke-width="10" />
    <circle cx="326" cy="306" r="13" stroke-width="10" />
    <circle cx="416" cy="306" r="13" stroke-width="10" />
    <circle cx="506" cy="306" r="13" stroke-width="10" />
  </g>
</svg>
