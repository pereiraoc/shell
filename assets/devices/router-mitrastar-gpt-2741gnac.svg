  <!-- MitraStar GPT-2741GNAC-N2 (gateway Vivo Fibra) em tres quartos, como na unica foto achada: caixa baixa quadrada de dois andares, sem antena externa, faixa perfurada no tampo (tracejado), respiro na base, 4 LEDs. 0,1 mm com 24 cm de canto a canto ESTIMADOS (medidas nao publicadas). So linhas. -->
